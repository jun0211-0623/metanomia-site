name: Build crypto news pages

# Korean manifest changes build both languages from the available manifests.
# Generated page commits do not re-trigger this workflow.
on:
  push:
    branches: [main]
    paths:
      - data/crypto-news.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: homepage-publish
  queue: max

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Record the build base
        id: base
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and audit static news pages
        run: |
          python3 scripts/build-news-pages.py
          python3 scripts/audit-site.py

      - name: Commit built pages
        env:
          EXPECTED_BASE: ${{ steps.base.outputs.commit }}
        run: |
          if [ -z "$(git status --porcelain -- sitemap.xml ':(glob)crypto-news-20*.html' ':(glob)ko/crypto-news-20*.html')" ]; then
            echo "no change"
            exit 0
          fi
          git fetch --no-tags origin main
          if [ "$(git rev-parse HEAD)" != "$EXPECTED_BASE" ] || [ "$(git rev-parse origin/main)" != "$EXPECTED_BASE" ]; then
            echo "origin/main changed after the build started; refusing stale publication." >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- sitemap.xml ':(glob)crypto-news-20*.html' ':(glob)ko/crypto-news-20*.html'
          git commit -m 'chore: build crypto news pages'
          git push origin HEAD:refs/heads/main

      - name: Report build completion
        run: |
          {
            echo "Korean pages and available English pages were built and audited."
            echo "English generation is handled by local Codex scheduled task."
            echo "New or updated Korean articles may have English translations pending until that task runs."
          } >> "$GITHUB_STEP_SUMMARY"
