<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#000000" />
  <meta name="robots" content="noindex, follow" />
  <meta name="description" content="The page you requested could not be found. Return to the Metanomia homepage." />
  <title>Page not found | Metanomia</title>
  <link rel="stylesheet" href="/style.css?v=20260818-3" />
  <style>
    .not-found { min-height: 100vh; display: grid; place-items: center; padding: 32px; background: #f2f2ed; }
    .not-found__panel { width: min(760px, 100%); border-top: 8px solid #baff21; background: #fff; padding: clamp(40px, 8vw, 88px); }
    .not-found__code { color: #6e6e69; font-size: 0.9rem; letter-spacing: 0.16em; }
    .not-found h1 { margin: 18px 0; font-size: clamp(2.3rem, 8vw, 5rem); line-height: 1.05; }
    .not-found h2 { margin: 0 0 18px; font-size: clamp(1.3rem, 4vw, 1.9rem); line-height: 1.2; }
    .not-found p { margin: 0 0 32px; color: #555; line-height: 1.8; }
    .not-found a { display: inline-block; border: 1px solid #111; background: #baff21; color: #111; padding: 14px 22px; text-decoration: none; font-weight: 700; }
    .not-found__alt { margin-top: clamp(40px, 6vw, 64px); padding-top: clamp(32px, 5vw, 48px); border-top: 1px solid #e2e2dd; }
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <main id="main-content" class="not-found">
    <section class="not-found__panel">
      <div class="not-found__code">ERROR 404</div>
      <h1>Page not found</h1>
      <p>The page you requested could not be found. Check the address, or start again from the homepage.</p>
      <a href="/">Go to homepage</a>
      <div class="not-found__alt" lang="ko">
        <h2>페이지를 찾을 수 없습니다.</h2>
        <p>주소를 확인하거나 홈페이지에서 다시 찾아보세요.</p>
        <a href="/ko">홈페이지로 이동</a>
      </div>
    </section>
  </main>
</body>
</html>
